apiVersion: apps/v1
kind: Deployment
metadata:
  name: weathergpt-api
  namespace: weathergpt
  labels:
    app: weathergpt-api
    version: blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: weathergpt-api
  template:
    metadata:
      labels:
        app: weathergpt-api
        version: blue
    spec:
      containers:
        - name: api
          image: ghcr.io/ashwinyadav09/weathergpt-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: weathergpt-config
            - secretRef:
                name: weathergpt-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weathergpt-web
  namespace: weathergpt
  labels:
    app: weathergpt-web
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: weathergpt-web
  template:
    metadata:
      labels:
        app: weathergpt-web
        version: blue
    spec:
      containers:
        - name: web
          image: ghcr.io/ashwinyadav09/weathergpt-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
