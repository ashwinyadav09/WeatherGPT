apiVersion: v1
kind: Service
metadata:
  name: weathergpt-api-svc
  namespace: weathergpt
spec:
  type: ClusterIP
  selector:
    app: weathergpt-api
    version: blue # Blue-green deployment switch target
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: weathergpt-web-svc
  namespace: weathergpt
spec:
  type: ClusterIP
  selector:
    app: weathergpt-web
    version: blue
  ports:
    - name: http
      port: 80
      targetPort: 80
