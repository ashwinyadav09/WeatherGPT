apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: weathergpt-api-hpa
  namespace: weathergpt
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: weathergpt-api
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
