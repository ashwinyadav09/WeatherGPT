models:
  provider: groq
  base_url_env: GROQ_BASE_URL
  api_key_env: GROQ_API_KEY
  main_model: llama-3.3-70b-versatile
  fast_model: llama-3.1-8b-instant
  selection_notes: Chosen via Prompt X model selection benchmark across 30 English
    and 30 Hindi cases. Groq Llama 3.3 70B Versatile provides state-of-the-art tool
    calling and 99.8% groundedness with TTFT ~210ms. Groq Llama 3.1 8B Instant provides
    lightning-fast (<100ms TTFT) routing and slot extraction at only $0.03/1k queries.
  performance:
    main_ttft_ms: 210.0
    main_p95_ms: 679.2
    fast_ttft_ms: 95.0
    fast_p95_ms: 263.6
    cost_per_1k_usd:
      main: 0.3406
      fast: 0.0301
  fallback:
    provider: openrouter
    base_url_env: OPENROUTER_BASE_URL
    api_key_env: OPENROUTER_API_KEY
    main_model: meta-llama/llama-3.3-70b-instruct
    fast_model: meta-llama/llama-3.1-8b-instruct
