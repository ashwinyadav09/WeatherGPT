hazard: heat_wave
reviewed_by: ashwin
reviewed_date: "2026-11-17"
source_title: "NDMA National Guidelines for Preparation of Action Plan - Prevention and Management of Heat Wave"
source_url: "https://ndma.gov.in/Governance/Guidelines/heat-wave"
retrieved_on: "2026-11-17"
reviewed: true

entries:
  en:
    id: "ndma_guidance_heat_wave_en"
    title: "Official Heat Wave Safety Guidance (NDMA & IMD)"
    items:
      - "Drink sufficient water frequently, even if not feeling thirsty. Use ORS, coconut water, or homemade lemon water."
      - "Wear lightweight, loose-fitting, light-coloured, breathable cotton clothes."
      - "Avoid strenuous physical activity outdoors during peak heat hours between 12:00 PM and 3:00 PM."
      - "Cover your head with a cloth, hat, or umbrella when stepping outside under direct sunlight."
      - "Keep children, elderly family members, pregnant women, and pets in cool, well-ventilated, shaded areas."
      - "Never leave children or pets inside closed parked vehicles, even for a few minutes."
      - "If someone shows signs of heat stroke (high fever, confusion, dizziness), move them to shade, apply cool wet towels, and seek immediate medical care."
  hi:
    id: "ndma_guidance_heat_wave_hi"
    title: "आधिकारिक लू (हीटवेव) सुरक्षा सलाह (एनडीएमए और आईएमडी)"
    items:
      - "प्यास न लगने पर भी बार-बार पर्याप्त पानी पिएं। ओआरएस, नींबू पानी, या छाछ का सेवन करें।"
      - "हल्के रंग के, ढीले और सूती कपड़े पहनें।"
      - "दोपहर 12:00 बजे से 3:00 बजे के बीच धूप में भारी शारीरिक काम करने से बचें।"
      - "धूप में बाहर निकलते समय सिर को सूती कपड़े, टोपी या छाते से ढक कर रखें।"
      - "बच्चों, बुजुर्गों, गर्भवती महिलाओं और पालतू जानवरों को ठंडे और हवादार स्थानों पर रखें।"
      - "खड़े वाहनों में बच्चों या पालतू जानवरों को कभी भी बंद न छोड़ें।"
      - "यदि किसी को लू लगने के लक्षण (तेज बुखार, चक्कर, बेहोशी) दिखें, तो तुरंत छाया में लाएं, ठंडे गीले कपड़े से पोछें और डॉक्टर से संपर्क करें।"
  bn:
    id: "ndma_guidance_heat_wave_bn"
    title: "অফিসিয়াল দাবদাহ (হিটওয়েভ) সুরক্ষা নির্দেশিকা (এনডিএমএ ও আইএমডি)"
    items:
      - "তৃষ্ণা না পেলেও ঘন ঘন পর্যাপ্ত জল পান করুন। ওআরএস, ডাবের জল বা বাড়িতে তৈরি লেবুর শরবত পান করুন।"
      - "হালকা রঙের, ঢিলেঢালা এবং আরামদায়ক সুতির পোশাক পরুন।"
      - "দুপুর ১২:০০ টা থেকে ৩:০০ টার মধ্যে তীব্র রোদে ভারী শারীরিক পরিশ্রম এড়িয়ে চলুন।"
      - "রোদে বাইরে বেরোনোর সময় সুতির কাপড়, টুপি বা ছাতা দিয়ে মাথা ঢেকে রাখুন।"
      - "শিশু, বয়স্ক ব্যক্তি, গর্ভবতী মহিলা এবং পোষা প্রাণীদের শীতল ও বাতাসযুক্ত ছায়াযুক্ত স্থানে রাখুন।"
      - "বন্ধ পার্ক করা গাড়ির ভিতরে শিশু বা পোষা প্রাণীকে কয়েক মিনিটের জন্যও একা ফেলে রাখবেন না।"
      - "কারও সানস্ট্রোক বা হিটস্ট্রোকের লক্ষণ (তীব্র জ্বর, বিভ্রান্তি, মাথা ঘোরা) দেখা দিলে তাকে তৎক্ষণাৎ ছায়ায় আনুন, ভেজা তোয়ালে দিয়ে শরীর মুছুন এবং দ্রুত ডাক্তারের পরামর্শ নিন।"
  mr:
    id: "ndma_guidance_heat_wave_mr"
    title: "अधिकृत उष्णतेची लाट (उष्णतेची लाट/लू) सुरक्षा मार्गदर्शक सूचना (एनडीएमए व आयएमडी)"
    items:
      - "तहान लागलेली नसली तरीही वारंवार पुरेसे पाणी प्या. ओआरएस, नारळ पाणी किंवा लिंबू सरबत घ्या."
      - "हलक्या रंगाचे, सैल आणि सुती कपडे परिधान करा."
      - "दुपारी १२:०० ते ३:०० या वेळेत उन्हामध्ये कष्टाची किंवा जड कामे करणे टाळा."
      - "उन्हात बाहेर पडताना डोके सुती कापड, टोपी किंवा छत्रीने झाकून ठेवा."
      - "लहान मुले, वृद्ध, गरोदर महिला आणि पाळीव प्राण्यांना थंड व हवेशीर सावलीच्या ठिकाणी ठेवा."
      - "बंद उभ्या वाहनात लहान मुलांना किंवा पाळीव प्राण्यांना काही मिनिटांसाठीही एकटे सोडू नका."
      - "कोणाला उष्माघाताची लक्षणे (तीव्र ताप, चक्कर येणे, गोंधळ) दिसल्यास ताबडतोब सावलीत आणा, ओल्या कपड्याने पुसा आणि त्वरित वैद्यकीय मदत घ्या."
  or:
    id: "ndma_guidance_heat_wave_or"
    title: "ସରକାରୀ ଗ୍ରୀଷ୍ମ ପ୍ରବାହ (ଅଂଶୁଘାତ) ସୁରକ୍ଷା ନିର୍ଦ୍ଦେଶାବଳୀ (ଏନଡିଏମଏ ଏବଂ ଆଇଏମଡି)"
    items:
      - "ଶୋଷ ନ ଲାଗିଲେ ମଧ୍ୟ ବାରମ୍ବାର ପର୍ଯ୍ୟାପ୍ତ ପାଣି ପିଅନ୍ତୁ। ଓଆରଏସ୍, ଲେମ୍ବୁ ପାଣି କିମ୍ବା ତୋରାଣି ପିଅନ୍ତୁ।"
      - "ହାଲୁକା ରଙ୍ଗର, ଢିଲା ଏବଂ ସୂତା ପୋଷାକ ପିନ୍ଧନ୍ତୁ।"
      - "ମଧ୍ୟାହ୍ନ ୧୨:୦୦ ରୁ ଅପରାହ୍ନ ୩:୦୦ ମଧ୍ୟରେ ଖରାରେ କଠିନ ପରିଶ୍ରମ କରନ୍ତୁ ନାହିଁ।"
      - "ଖରାରେ ବାହାରକୁ ଯିବା ସମୟରେ ମୁଣ୍ଡକୁ କପଡ଼ା, ଟୋପି କିମ୍ବା ଛତା ଦ୍ୱାରା ଘୋଡ଼ାଇ ରଖନ୍ତୁ।"
      - "ଛୋଟ ପିଲା, ବୟସ୍କ, ଗର୍ଭବତୀ ମହିଳା ଏବଂ ଗୃହପାଳିତ ପଶୁଙ୍କୁ ଥଣ୍ଡା ତଥା ବାୟୁ ଚଳାଚଳ ଥିବା ଛାଇ ସ୍ଥାନରେ ରଖନ୍ତୁ।"
      - "ବନ୍ଦ ଥିବା ଗାଡ଼ି ଭିତରେ ଛୋଟ ପିଲା କିମ୍ବା ପୋଷା ଜୀବଙ୍କୁ କଦାପି ଛାଡ଼ି ଯାଆନ୍ତୁ ନାହିଁ।"
      - "ଯଦି କାହାକୁ ଅଂଶୁଘାତର ଲକ୍ଷଣ (ପ୍ରବଳ ଜ୍ୱର, ମୁଣ୍ଡ ବୁଲାଇବା, ଅଚେତ ହେବା) ଦେଖାଯାଏ, ତୁରନ୍ତ ଛାଇକୁ ଆଣନ୍ତୁ, ଓଦା କପଡ଼ାରେ ପୋଛନ୍ତୁ ଏବଂ ଡାକ୍ତରଙ୍କ ସହ ଯୋଗାଯୋଗ କରନ୍ତୁ।"
  ta:
    id: "ndma_guidance_heat_wave_ta"
    title: "அதிகாரப்பூர்வ வெப்ப அலை பாதுகாப்பு வழிகாட்டுதல்கள் (என்டிஎம்ஏ மற்றும் ஐஎம்டி)"
    items:
      - "தாகம் எடுக்காவிட்டாலும் அடிக்கடி போதுமான தண்ணீர் குடியுங்கள். ஓஆர்எஸ், இளநீர் அல்லது எலுமிச்சை சாறு அருந்துங்கள்."
      - "மென்மையான, தளர்வான, வெளிர் நிற பருத்தி ஆடைகளை அணியுங்கள்."
      - "நண்பகல் 12:00 மணி முதல் மதியம் 3:00 மணி வரை கடுமையான வெயிலில் உடலுழைப்பு செய்வதைத் தவிர்க்கவும்."
      - "வெயிலில் வெளியே செல்லும்போது துணி, தொப்பி அல்லது குடையால் தலையை மூடவும்."
      - "குழந்தைகள், முதியவர்கள், கர்ப்பிணிப் பெண்கள் மற்றும் செல்லப்பிராணிகளை குளிர்ந்த, காற்றோட்டமான நிழலான இடங்களில் வைக்கவும்."
      - "நிறுத்தப்பட்ட மூடிய வாகனங்களுக்குள் குழந்தைகளையோ அல்லது செல்லப்பிராணிகளையோ சில நிமிடங்களுக்கு கூட விட்டுச் செல்லாதீர்கள்."
      - "யாருக்காவது வெப்ப பக்கவாத அறிகுறிகள் (அதிக காய்ச்சல், தலைசுற்றல், மயக்கம்) தென்பட்டால், உடனடியாக நிழலுக்குக் கொண்டுவந்து, குளிர்ந்த ஈரத்துணியால் துடைத்து, உடனே மருத்துவ உதவியை நாடுங்கள்."
  te:
    id: "ndma_guidance_heat_wave_te"
    title: "అధికారిక వడగాల్పుల భద్రతా మార్గదర్శకాలు (ఎన్‌డిఎమ్‌ఎ మరియు ఐఎమ్‌డి)"
    items:
      - "దాహం వేయకపోయినా తరచుగా తగినంత నీరు త్రాగాలి. ఓఆర్‌ఎస్, కొబ్బరి నీళ్లు లేదా నిమ్మరసం తీసుకోండి."
      - "లేత రంగు, వదులుగా ఉండే కాటన్ దుస్తులను ధరించండి."
      - "మధ్యాహ్నం 12:00 నుండి 3:00 గంటల మధ్య ఎండ తీవ్రంగా ఉన్న సమయంలో బయట శ్రమతో కూడిన పనులు చేయవద్దు."
      - "ఎండలో బయటకు వెళ్లేటప్పుడు తలకు వస్త్రం, టోపీ లేదా గొడుగుతో రక్షణ కల్పించుకోండి."
      - "పిల్లలు, వృద్ధులు, గర్భిణీ స్త్రీలు మరియు పెంపుడు జంతువులను చల్లని, గాలి ఆడే నీడ ప్రదేశాలలో ఉంచండి."
      - "పార్కింగ్ చేసిన మూసివున్న వాహనాల్లో పిల్లలను లేదా పెంపుడు జంతువులను కొన్ని నిమిషాలైనా ఒంటరిగా ఉంచవద్దు."
      - "ఎవరికైనా వడదెబ్బ లక్షణాలు (తీవ్రమైన జ్వరం, తలతిరగడం, అపస్మారక స్థితి) కనిపిస్తే, వెంటనే నీడకు చేర్చి, తడి గుడ్డతో తుడిచి, వెంటనే వైద్య సహాయం అందించండి."
