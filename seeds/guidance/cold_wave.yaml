entries:
  en:
    id: "ndma_guidance_cold_wave_en"
    title: "Official Cold Wave Safety Guidance (NDMA & IMD)"
    items:
      - "Wear multiple layers of loose, warm, lightweight clothing instead of a single heavy garment."
      - "Cover head, neck, hands, and feet properly, as maximum body heat is lost from these areas."
      - "Ensure adequate ventilation when using charcoal burners (angithi) or gas heaters to prevent deadly carbon monoxide poisoning."
      - "Protect elderly persons, infants, and patients with asthma or heart conditions from prolonged exposure to cold winds."
      - "Drink warm fluids like soups, warm milk, or herbal teas to help maintain body temperature."
      - "Provide dry bedding and protected shelter for cattle, domestic animals, and pets during severe cold nights."
  hi:
    id: "ndma_guidance_cold_wave_hi"
    title: "आधिकारिक शीतलहर (कोल्ड वेव) सुरक्षा सलाह (एनडीएमए और आईएमडी)"
    items:
      - "एक भारी कपड़े के बजाय ढीले, हल्के और कई परतों वाले गर्म कपड़े पहनें।"
      - "सिर, गर्दन, हाथ और पैरों को अच्छी तरह से ढकें, क्योंकि इन्हीं अंगों से शरीर की गर्मी सबसे तेजी से निकलती है।"
      - "कमरे में अंगीठी, हीटर या कोयला जलाते समय कमरे में वेंटिलेशन (हवा का निकास) अवश्य रखें ताकि कार्बन मोनोऑक्साइड गैस का खतरा न हो।"
      - "बुजुर्गों, शिशुओं और सांस या दिल के मरीजों को ठंडी हवा के सीधे संपर्क से बचाएं।"
      - "गर्म पेय जैसे सूप, गर्म दूध या चाय का सेवन करें जिससे शरीर का तापमान बना रहे।"
      - "शीतलहर के दौरान मवेशियों और पालतू जानवरों को ठंड से बचाने के लिए सूखे बिछावन और सुरक्षित बाड़े की व्यवस्था करें।"
  bn:
    id: "ndma_guidance_cold_wave_bn"
    title: "অফিসিয়াল শৈত্যপ্রবাহ (কোল্ড ওয়েভ) সুরক্ষা পরামর্শ (এনডিএমএ ও আইএমডি)"
    items:
      - "একটি ভারী কাপড়ের বদলে একাধিক স্তরের ঢিলেঢালা, হালকা ও গরম পোশাক পরুন।"
      - "মাথা, ঘাড়, হাত ও পা ভালো করে ঢেকে রাখুন, কারণ এসব অংশ দিয়েই শরীরের সবচেয়ে বেশি তাপ বেরিয়ে যায়।"
      - "কয়লার উনুন বা গ্যাস হিটার ব্যবহারের সময় ঘরে পর্যাপ্ত বাতাস চলাচলের ব্যবস্থা রাখুন, যাতে প্রাণঘাতী কার্বন মনোক্সাইড বিষক্রিয়া না ঘটে।"
      - "বয়স্ক ব্যক্তি, শিশু এবং শ্বাসকষ্ট বা হৃদরোগীদের দীর্ঘক্ষণ ঠাণ্ডা বাতাসের সংস্পর্শ থেকে দূরে রাখুন।"
      - "শরীরের তাপমাত্রা বজায় রাখতে স্যুপ, গরম দুধ বা ভেষজ চায়ের মতো গরম পানীয় পান করুন।"
      - "তীব্র ঠাণ্ডার রাতে গবাদি পশু ও পোষা প্রাণীদের জন্য শুকনো বিছানা ও নিরাপদ আশ্রয়ের ব্যবস্থা করুন।"
  mr:
    id: "ndma_guidance_cold_wave_mr"
    title: "अधिकृत थंडीची लाट (कोल्ड वेव्ह) सुरक्षा मार्गदर्शक सूचना (एनडीएमए व आयएमडी)"
    items:
      - "एका जाड कपड्याऐवजी सैलसर, हलके आणि अनेक पदरी उबदार कपडे परिधान करा."
      - "डोके, मान, हात आणि पाय व्यवस्थित झाकून ठेवा, कारण या भागांतून शरीरातील उष्णता सर्वाधिक बाहेर पडते."
      - "कार्बन मोनॉक्साइडच्या विषबाधेचा धोका टाळण्यासाठी शेकोटी, शेगडी किंवा हिटर वापरताना खोलीत पुरेशी हवा खेळती ठेवा."
      - "वृद्ध व्यक्ती, लहान मुले आणि दमा किंवा हृदयविकार असलेल्या रुग्णांना थंड वाऱ्याच्या थेट संपर्कापासून वाचवा."
      - "शरीराचे तापमान योग्य राखण्यासाठी सूप, गरम दूध किंवा काढा यांसारखे गरम द्रवपदार्थ प्या."
      - "कडाक्याच्या थंडीच्या रात्री जनावरे आणि पाळीव प्राण्यांसाठी कोरडी अंथरुणे व सुरक्षित निवाऱ्याची सोय करा."
  or:
    id: "ndma_guidance_cold_wave_or"
    title: "ସରକାରୀ ଶୀତ ଲହରୀ ସୁରକ୍ଷା ପରାମର୍ଶ (ଏନଡିଏମଏ ଏବଂ ଆଇଏମଡି)"
    items:
      - "ଗୋଟିଏ ମୋଟା ପୋଷାକ ବଦଳରେ ଅନେକ ସ୍ତରର ଢିଲା, ହାଲୁକା ଏବଂ ଉଷୁମ ପୋଷାକ ପିନ୍ଧନ୍ତୁ।"
      - "ମୁଣ୍ଡ, ବେକ, ହାତ ଏବଂ ପାଦ ଭଲ ଭାବରେ ଘୋଡ଼ାଇ ରଖନ୍ତୁ, କାରଣ ଏହି ଅଂଶଗୁଡ଼ିକରୁ ଶରୀରର ତାପମାତ୍ରା ସର୍ବାଧିକ କମିଯାଏ।"
      - "କାର୍ବନ ମନୋକ୍ସାଇଡ ଗ୍ୟାସ ଜନିତ ବିଷକ୍ରିୟା ଏଡ଼ାଇବା ପାଇଁ କୋଇଲା ଚୁଲି ବା ହିଟର ବ୍ୟବହାର ସମୟରେ ଘରେ ବାୟୁ ଚଳାଚଳ ସୁନିଶ୍ଚିତ କରନ୍ତୁ।"
      - "ବୟସ୍କ ବ୍ୟକ୍ତି, ଶିଶୁ ଏବଂ ଶ୍ୱାସକଷ୍ଟ କିମ୍ବା ହୃଦରୋଗୀଙ୍କୁ ପ୍ରବଳ ଶୀତ ପବନରୁ ସୁରକ୍ଷିତ ରଖନ୍ତୁ।"
      - "ଶରୀରର ତାପମାତ୍ରା ବଜାୟ ରଖିବା ପାଇଁ ସୁପ୍, ଉଷୁମ କ୍ଷୀର କିମ୍ବା ଚା ଭଳି ଗରମ ପାନୀୟ ପିଅନ୍ତୁ।"
      - "ପ୍ରବଳ ଶୀତ ରାତିରେ ଗୃହପାଳିତ ପଶୁମାନଙ୍କ ପାଇଁ ଶୁଖିଲା ବିଛଣା ଏବଂ ସୁରକ୍ଷିତ ଆଶ୍ରୟର ବ୍ୟବସ୍ଥା କରନ୍ତୁ।"
  ta:
    id: "ndma_guidance_cold_wave_ta"
    title: "அதிகாரப்பூர்வ குளிரலை பாதுகாப்பு வழிகாட்டுதல்கள் (என்டிஎம்ஏ மற்றும் ஐஎம்டி)"
    items:
      - "ஒரே தடிமனான ஆடைகளுக்குப் பதிலாக, பல அடுக்கு தளர்வான, மென்மையான கதகதப்பான ஆடைகளை அணியுங்கள்."
      - "தலை, கழுத்து, கைகள் மற்றும் கால்களை நன்றாக மூடுங்கள், ஏனெனில் இந்த பகுதிகளிலிருந்தே உடலின் வெப்பம் அதிகம் வெளியேறுகிறது."
      - "கரி அடுப்புகள் அல்லது ஹீட்டர்களைப் பயன்படுத்தும்போது கொடிய கார்பன் மோனாக்சைடு நச்சுத்தன்மையைத் தடுக்க போதுமான காற்றோட்டத்தை உறுதி செய்யுங்கள்."
      - "முதியவர்கள், குழந்தைகள், ஆஸ்துமா மற்றும் இதய நோயாளிகளை குளிர்ந்த காற்றின் நேரடித் தாக்கத்திலிருந்து பாதுகாக்கவும்."
      - "உடல் வெப்பநிலையைப் பராமரிக்க சூப், வெதுவெதுப்பான பால் அல்லது மூலிகை தேநீர் போன்ற சூடான பானங்களை அருந்துங்கள்."
      - "கடும் குளிர்கால இரவுகளில் கால்நடைகள் மற்றும் செல்லப்பிராணிகளுக்கு உலர் படுக்கை மற்றும் பாதுகாப்பான தங்குமிடம் வழங்கவும்."
  te:
    id: "ndma_guidance_cold_wave_te"
    title: "అధికారిక శీతల గాలుల భద్రతా మార్గదర్శకాలు (ఎన్‌డిఎమ్‌ఎ మరియు ఐఎమ్‌డి)"
    items:
      - "ఒకే మందపాటి బట్టలకు బదులుగా బహుళ పొరల వదులైన, తేలికపాటి వెచ్చని దుస్తులను ధరించండి."
      - "తల, మెడ, చేతులు మరియు పాదాలను సరిగ్గా కప్పుకోండి, ఎందుకంటే శరీర వేడి ఎక్కువగా ఈ భాగాల నుండే బయటకు పోతుంది."
      - "ప్రాణాంతక కార్బన్ మోనాక్సైడ్ విషవాయువు ప్రమాదాన్ని నివారించడానికి గదిలో హీటర్లు వాడేటప్పుడు సరైన గాలి వెలుతురు ఉండేలా చూసుకోండి."
      - "వృద్ధులు, చిన్నపిల్లలు, ఉబ్బసం లేదా గుండె జబ్బులు ఉన్న రోగులను చల్లటి గాలుల బారిన పడకుండా కాపాడండి."
      - "శరీర ఉష్ణోగ్రతను కాపాడుకోవడానికి సూప్‌లు, వేడి పాలు లేదా మూలికా టీ వంటి వేడి ద్రవాలను తీసుకోండి."
      - "తీవ్రమైన చలి రాత్రులలో పశువులు మరియు పెంపుడు జంతువులకు పొడి పడకలు మరియు సురక్షితమైన ఆశ్రయాన్ని కల్పించండి."
