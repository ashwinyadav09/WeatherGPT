  tomorrow: రేపు
  day_after_tomorrow: ఎల్లుండి
  this_week: ఈ వారం
  morning: ఉదయం
  afternoon: మధ్యాహ్నం
  evening: సాయంత్రం
  night: రాత్రి
units:
  celsius: డిగ్రీల సెల్సియస్
  mm: మిల్లీమీటర్లు
  kmh: కిలోమీటర్లు ప్రతి గంటకు
  percent: శాతం
crops:
  wheat: గోధుమ
  rice: వరి
